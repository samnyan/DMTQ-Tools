name: Build DMTQ-Tools for Windows

on:
  push:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
  RUNTIME_IDENTIFIER: win-x64
  BUILD_OUTPUT: artifacts/DMTQ-Tools

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: maui-windows

      - name: Restore dependencies
        run: >-
          dotnet restore DMTQ-Tools/DMTQ-Tools.csproj
          --runtime ${{ env.RUNTIME_IDENTIFIER }}
          -p:Configuration=Release

      - name: Publish Windows app
        run: >-
          dotnet publish DMTQ-Tools/DMTQ-Tools.csproj
          --configuration Release
          --framework ${{ env.TARGET_FRAMEWORK }}
          --runtime ${{ env.RUNTIME_IDENTIFIER }}
          --no-restore
          --self-contained false
          --output ${{ env.BUILD_OUTPUT }}
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=false

      - name: Remove release symbols
        shell: pwsh
        run: ./scripts/Prune-WindowsPublish.ps1 -PublishDirectory $env:BUILD_OUTPUT

      - name: Validate Windows publish
        shell: pwsh
        run: ./scripts/Test-WindowsPublish.ps1 -PublishDirectory $env:BUILD_OUTPUT

      - name: Measure Windows publish output
        shell: pwsh
        run: ./scripts/Measure-WindowsPublish.ps1 -PublishDirectory $env:BUILD_OUTPUT -MaximumSizeMiB 135

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMTQ-Tools-windows
          path: ${{ env.BUILD_OUTPUT }}
          if-no-files-found: error
